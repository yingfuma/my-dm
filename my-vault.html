  /* 悬浮添加按钮 */
  .fab {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
    background-size: 200% 200%;
    border: none;
    border-radius: 22px;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 15px 40px rgba(99, 102, 241, 0.5);
    animation: gradientShift 3s ease infinite, fabPulse 2.5s ease-in-out infinite;
    z-index: 90;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fab:hover {
    transform: scale(1.15) rotate(90deg);
    box-shadow: 0 20px 50px rgba(99, 102, 241, 0.65);
    border-radius: 24px;
  }
  .fab:active { transform: scale(1.08); }

  @keyframes fabPulse {
    0%, 100% { box-shadow: 0 15px 40px rgba(99, 102, 241, 0.5); }
    50% { box-shadow: 0 15px 55px rgba(99, 102, 241, 0.75); }
  }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.25s ease;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    width: 100%;
    max-width: 480px;
    background: rgba(10, 10, 28, 0.95);
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(50px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 30px;
    padding: 36px 30px 30px;
    max-height: 92vh;
    overflow-y: auto;
    animation: modalIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.08) transparent;
    position: relative;
  }
  .modal::-webkit-scrollbar { width: 5px; }
  .modal::-webkit-scrollbar-thumb { 
    background: rgba(255,255,255,0.08); 
    border-radius: 3px; 
  }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #6366f1, #ec4899, transparent);
    border-radius: 30px 30px 0 0;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(30px) scale(0.92); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
  }
  .modal-title {
    font-size: 22px;
    font-weight: 700;
    color: #f1f5f9;
    background: linear-gradient(135deg, #fff, #c7d2fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .modal-close {
    width: 38px;
    height: 38px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 12px;
    color: #64748b;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
  }
  .modal-close:hover { 
    background: rgba(239, 68, 68, 0.15); 
    color: #f87171; 
    border-color: rgba(239, 68, 68, 0.3);
    transform: rotate(90deg);
  }

<script>
// ========== IndexedDB 文件存储 ==========
const DB_NAME = 'my_vault_db';
const DB_VERSION = 1;
const FILE_STORE = 'files';

let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    
    request.onerror = () => reject(request.error);
    request.onsuccess = () => {
      db = request.result;
      resolve(db);
    };
    
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(FILE_STORE)) {
        database.createObjectStore(FILE_STORE, { keyPath: 'id' });
      }
    };
  });
}

function saveFile(id, dataUrl) {
  return new Promise((resolve, reject) => {
    if (!db) { reject('DB not initialized'); return; }
    const tx = db.transaction(FILE_STORE, 'readwrite');
    const store = tx.objectStore(FILE_STORE);
    const request = store.put({ id, dataUrl });
    request.onsuccess = () => resolve(id);
    request.onerror = () => reject(request.error);
  });
}

function getFile(id) {
  return new Promise((resolve, reject) => {
    if (!db) { reject('DB not initialized'); return; }
    const tx = db.transaction(FILE_STORE, 'readonly');
    const store = tx.objectStore(FILE_STORE);
    const request = store.get(id);
    request.onsuccess = () => resolve(request.result?.dataUrl || null);
    request.onerror = () => reject(request.error);
  });
}

function deleteFile(id) {
  return new Promise((resolve, reject) => {
    if (!db) { reject('DB not initialized'); return; }
    const tx = db.transaction(FILE_STORE, 'readwrite');
    const store = tx.objectStore(FILE_STORE);
    const request = store.delete(id);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

function getAllFiles() {
  return new Promise((resolve, reject) => {
    if (!db) { reject('DB not initialized'); return; }
    const tx = db.transaction(FILE_STORE, 'readonly');
    const store = tx.objectStore(FILE_STORE);
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error);
  });
}

// 生成唯一文件ID
function genFileId(type = 'img') {
  return type + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
}

// ========== 数据管理 ==========
const STORAGE_KEY = 'my_vault_data';
const GALLERY_KEY = 'my_vault_gallery';
const TRASH_KEY = 'my_vault_trash';
const PASSWORD_KEY = 'my_vault_pass';

  isLoggedIn: false,
  currentCategory: 'all',
  currentTab: 'info',
  editingId: null,
  currentImages: [],
  viewerImages: [],
  viewerIndex: 0,
  viewerRotation: 0,
  currentAlbumId: null,
  editingAlbumId: null,
  pendingPhotos: [],
  currentView: 'main', // main | trash
  trashTab: 'info',
  revealedPwds: {}
};

// 文件缓存（id -> dataURL），从 IndexedDB 加载
const fileCache = {};

async function loadFileCache() {
  try {
    const files = await getAllFiles();
    files.forEach(f => {
      fileCache[f.id] = f.dataUrl;
    });
    return files.length;
  } catch(e) {
    console.error('加载文件缓存失败', e);
    return 0;
  }
}

// 保存文件到 IndexedDB 并更新缓存
async function cacheFile(id, dataUrl) {
  fileCache[id] = dataUrl;
  try {
    await saveFile(id, dataUrl);
  } catch(e) {
    console.error('保存文件失败', e);
  }
}

// 从缓存和 IndexedDB 删除文件
async function uncacheFile(id) {
  delete fileCache[id];
  try {
    await deleteFile(id);
  } catch(e) {
    console.error('删除文件失败', e);
  }
}

// 获取文件 dataURL（从缓存取）
function getCachedFile(id) {
  return fileCache[id] || null;
}

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch(e) {
    showToast('存储空间不足', true);
    return false;
  }
}

function getGallery() {
  try {
    const raw = localStorage.getItem(GALLERY_KEY);
    const data = raw ? JSON.parse(raw) : { albums: [], photos: [], videos: [] };
    if (!data.videos) data.videos = [];
    return data;
  } catch(e) { return { albums: [], photos: [], videos: [] }; }
}

function saveGallery(gallery) {
  try {
    localStorage.setItem(GALLERY_KEY, JSON.stringify(gallery));
    return true;
  } catch(e) {
    showToast('存储空间不足', true);
    return false;
  }
}

function getTrash() {
  try {
    const raw = localStorage.getItem(TRASH_KEY);
    const data = raw ? JSON.parse(raw) : { info: [], photos: [], videos: [] };
    if (!data.videos) data.videos = [];
    return data;
  } catch(e) { return { info: [], photos: [], videos: [] }; }
}

function saveTrash(trash) {
  try {
    localStorage.setItem(TRASH_KEY, JSON.stringify(trash));
    return true;
  } catch(e) {
    showToast('存储空间不足', true);
    return false;
  }
}

function hasPassword() {

}

// ========== 工具函数 ==========
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// 解析文件源：如果是 fileId 就从缓存取 dataURL，否则直接返回
function resolveSrc(srcOrId) {
  if (!srcOrId) return '';
  if (srcOrId.startsWith('data:')) return srcOrId;
  return getCachedFile(srcOrId) || '';
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制');
  }
}

function formatBytes(bytes) {
  if (bytes > 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + 'M';
  if (bytes > 1024) return (bytes / 1024).toFixed(0) + 'K';
  return bytes + 'B';
}

function formatDuration(seconds) {
  if (!seconds || seconds < 0) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' + s : s);
}

function updateTrashBadge() {
  const trash = getTrash();
  const count = trash.info.length + trash.photos.length + trash.videos.length;
  const badge = document.getElementById('trashBadge');
  if (count > 0) {
    badge.style.display = 'flex';
    badge.textContent = count > 99 ? '99+' : count;
  } else {
    badge.style.display = 'none';
  }
}

// ========== 登录 ==========
function showLoginForm() {
  document.getElementById('loginTitle').textContent = '欢迎回来';
  document.getElementById('loginSubtitle').textContent = '输入密码进入你的信息空间';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('setupForm').style.display = 'none';
  document.getElementById('loginPassword').focus();
}

function showSetupForm() {
  document.getElementById('loginTitle').textContent = '创建你的空间';
  document.getElementById('loginSubtitle').textContent = '设置一个密码保护你的信息';
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('setupForm').style.display = 'block';
  document.getElementById('setupPassword1').focus();
}

function doLogin() {
  const pass = document.getElementById('loginPassword').value;
  const saved = localStorage.getItem(PASSWORD_KEY);
  const errEl = document.getElementById('loginError');
  
  if (!pass) { errEl.textContent = '请输入密码'; return; }
  
  if (pass === saved) {
    state.isLoggedIn = true;
    errEl.textContent = '';
    enterApp();
  } else {
    errEl.textContent = '密码错误，请重试';
    errEl.classList.remove('shake');
    void errEl.offsetWidth;
    errEl.classList.add('shake');
    const input = document.getElementById('loginPassword');
    input.value = '';
    input.focus();
  }
}

function doSetup() {
  const p1 = document.getElementById('setupPassword1').value;
  const p2 = document.getElementById('setupPassword2').value;
  const errEl = document.getElementById('setupError');
  
  if (!p1 || p1.length < 4) { errEl.textContent = '密码至少4位'; return; }
  if (p1 !== p2) { errEl.textContent = '两次输入的密码不一致'; return; }
  
  localStorage.setItem(PASSWORD_KEY, p1);
  saveData(sampleData);
  saveGallery({ albums: [], photos: [], videos: [] });
  saveTrash({ info: [], photos: [], videos: [] });
  state.isLoggedIn = true;
  showToast('空间创建成功！');
  setTimeout(enterApp, 500);
}

function enterApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'block';
  renderAll();
  updateTrashBadge();
}

function lockApp() {
  state.isLoggedIn = false;
  state.currentView = 'main';
  document.getElementById('appPage').style.display = 'none';
  document.getElementById('trashView').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
  showLoginForm();
}

function resetAll() {
  if (!confirm('确定要重置所有数据吗？此操作不可恢复！')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(GALLERY_KEY);
  localStorage.removeItem(TRASH_KEY);
  localStorage.removeItem(PASSWORD_KEY);
  location.reload();
}

// ========== 视图切换 ==========
function switchTab(tab) {
  state.currentTab = tab;
  state.currentView = 'main';
  
  document.querySelectorAll('.nav-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  
  document.getElementById('infoView').style.display = tab === 'info' ? 'block' : 'none';
  document.getElementById('galleryView').style.display = tab === 'gallery' ? 'block' : 'none';
  document.getElementById('trashView').style.display = 'none';
  document.getElementById('fabBtn').style.display = 'flex';
  
  if (tab === 'gallery') {
    renderAlbumList();
  }
}

function showTrash() {
  state.currentView = 'trash';
  document.getElementById('infoView').style.display = 'none';
  document.getElementById('galleryView').style.display = 'none';
  document.getElementById('trashView').style.display = 'block';
  document.getElementById('fabBtn').style.display = 'none';
  
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  
  renderTrash();
}

function backToMain() {
  state.currentView = 'main';
  document.getElementById('trashView').style.display = 'none';
  document.getElementById('fabBtn').style.display = 'flex';
  
  if (state.currentTab === 'info') {
    document.getElementById('infoView').style.display = 'block';
    document.querySelector('[data-tab="info"]').classList.add('active');
    renderCards();
  } else {
    document.getElementById('galleryView').style.display = 'block';
    document.querySelector('[data-tab="gallery"]').classList.add('active');
    renderAlbumList();
  }
}

function renderAll() {
  renderCategoryTabs();
  renderCards();
  updateGalleryStats();
}

// ========== 信息卡片渲染 ==========
function renderCards() {
  const container = document.getElementById('cardsContainer');
  const search = document.getElementById('searchInput').value.toLowerCase();
  let data = getData().filter(item => !item.deletedAt);
  
  if (state.currentCategory !== 'all') {
    data = data.filter(item => item.category === state.currentCategory);
  }
  
  if (search) {
    data = data.filter(item => 
      (item.name || '').toLowerCase().includes(search) ||
      (item.account || '').toLowerCase().includes(search) ||
      (item.note || '').toLowerCase().includes(search)
    );
  }
  
  if (data.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <p class="empty-title">${search ? '没有找到匹配的信息' : '还没有任何信息'}</p>
        <p class="empty-text">点击右下角 + 按钮添加</p>
      </div>
    `;
    return;
  }
  
  const catInfo = {};
  categories.forEach(c => catInfo[c.id] = c);
  
  container.innerHTML = data.map((item, idx) => {
    const imgs = item.images || [];
    const showImgs = imgs.slice(0, 4);
    const extraCount = imgs.length - 4;
    
    return `
    <div class="info-card" style="animation-delay: ${idx * 0.05}s" data-item-id="${item.id}" data-action="edit-item">
      <div class="card-header">
        <div class="card-icon cat-${item.category}">${catInfo[item.category]?.icon || '📝'}</div>
        <div class="card-title">
          <h3>${escapeHtml(item.name)}</h3>
          <div class="card-cat">${catInfo[item.category]?.name || '其他'}${imgs.length ? ' · ' + imgs.length + '张图' : ''}</div>
        </div>
      </div>
      <div class="card-fields">
        <div class="field-row">
          <span class="field-label">账号</span>
          <span class="field-value">${escapeHtml(item.account)}</span>
          <button class="copy-btn" data-action="copy" data-text="${encodeURIComponent(item.account)}" title="复制">📋</button>
        </div>
        ${item.password ? `
        <div class="field-row">
          <span class="field-label">密码</span>
          <span class="field-value masked" id="pwd-${item.id}">••••••••</span>
          <button class="copy-btn" data-action="toggle-pwd" data-item-id="${item.id}" title="显示/隐藏">👁</button>
        </div>
        ` : ''}
        ${item.note ? `
        <div class="field-row">
          <span class="field-label">备注</span>
          <span class="field-value" style="color:#64748b; font-family: inherit;">${escapeHtml(item.note)}</span>
        </div>
        ` : ''}
      </div>
      ${imgs.length ? `
      <div class="card-images">
        ${showImgs.map((img, i) => `
          <div class="card-img-thumb" data-action="view-img" data-item-id="${item.id}" data-img-idx="${i}">
            <img src="${resolveSrc(img)}" alt="">
            <button class="card-img-remove" data-action="remove-card-img" data-item-id="${item.id}" data-img-idx="${i}" title="删除图片">✕</button>
            <button class="card-img-download" data-action="download-card-img" data-item-id="${item.id}" data-img-idx="${i}" title="下载图片">⬇</button>
            ${extraCount > 0 && i === 3 ? `<div class="card-img-more">+${extraCount}</div>` : ''}
          </div>
        `).join('')}
      </div>
      ` : ''}
    </div>
    `;
  }).join('');
}

// ========== 回收站渲染 ==========
function renderTrash() {
  const trash = getTrash();
  
  // 更新统计
  let totalSize = 0;
  trash.info.forEach(item => (item.images || []).forEach(img => totalSize += img.length * 0.75));
  trash.photos.forEach(p => totalSize += (p.src || '').length * 0.75);
  trash.videos.forEach(v => totalSize += (v.src || '').length * 0.75);
  
  document.getElementById('tStatInfo').textContent = trash.info.length;
  document.getElementById('tStatPhotos').textContent = trash.photos.length;
  document.getElementById('tStatVideos').textContent = trash.videos.length;
  document.getElementById('tStatSize').textContent = formatBytes(totalSize);
  
  // 子标签
  document.querySelectorAll('.trash-subtab').forEach(el => {
    el.classList.toggle('active', el.dataset.trashTab === state.trashTab);
  });
  
  if (state.trashTab === 'info') {
    renderTrashInfo();
  } else if (state.trashTab === 'photo') {
    renderTrashPhotos();
  } else {
    renderTrashVideos();
  }
}

// ========== 相册渲染 ==========
function renderAlbumList() {
  const grid = document.getElementById('albumGrid');
  const gallery = getGallery();
  const albums = gallery.albums;
  
  if (albums.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1; padding: 60px 20px;">
        <div class="empty-icon">📁</div>
        <p class="empty-title">还没有相册</p>
        <p class="empty-text">点击上方"新建相册"创建第一个相册</p>
      </div>
    `;
    updateGalleryStats();
    return;
  }
  
  grid.innerHTML = albums.map((album, idx) => {
    const photos = gallery.photos.filter(p => p.albumId === album.id && p.src);
    const videos = gallery.videos.filter(v => v.albumId === album.id && v.src);
    const coverImgs = photos.slice(0, 4).map(p => p.src);
    const photoCount = photos.length;
    const videoCount = videos.length;
    
    let coverHtml = '';
    if (coverImgs.length === 0) {
      // 没有照片但有视频，显示视频图标
      if (videoCount > 0) {
        coverHtml = '<div class="album-cover" style="background:linear-gradient(135deg,#1e1b4b,#312e81);"><span style="font-size:48px;">🎬</span></div>';
      } else {
        coverHtml = '<div class="album-cover">🖼️</div>';
      }
    } else if (coverImgs.length === 1) {
      coverHtml = `<div class="album-cover"><img src="${resolveSrc(coverImgs[0])}" alt=""></div>`;
    } else {
      const imgsHtml = coverImgs.map(src => `<img src="${resolveSrc(src)}" alt="">`).join('');
      coverHtml = `<div class="album-cover album-cover-multi">${imgsHtml}</div>`;
    }
    
    let countText = '';
    if (photoCount > 0 && videoCount > 0) {
      countText = `${photoCount} 照片 · ${videoCount} 视频`;
    } else if (photoCount > 0) {
      countText = `${photoCount} 张照片`;
    } else if (videoCount > 0) {
      countText = `${videoCount} 个视频`;
    } else {
      countText = '空相册';
    }
    
    return `
      <div class="album-card" style="animation-delay: ${idx * 0.05}s" data-album-id="${album.id}">
        ${coverHtml}
        <div class="album-info">
          <div class="album-name">${escapeHtml(album.name)}</div>
          <div class="album-count">${countText}</div>
        </div>
      </div>
    `;
  }).join('');
  
  updateGalleryStats();
}

}

function renderPhotoList(albumId) {
  const grid = document.getElementById('photoGrid');
  const gallery = getGallery();
  const photos = gallery.photos.filter(p => p.albumId === albumId && p.src);
  const videos = gallery.videos.filter(v => v.albumId === albumId && v.src);
  
  if (photos.length === 0 && videos.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1; padding: 50px 20px;">
        <div class="empty-icon">🖼️</div>
        <p class="empty-title">相册是空的</p>
        <p class="empty-text">点击右上角上传照片或视频</p>
      </div>
    `;
    window._photoList = [];
    window._videoList = [];
    return;
  }
  
  // 照片 HTML
  const photosHtml = photos.map((photo, idx) => `
    <div class="photo-item" style="animation-delay: ${idx * 0.03}s" data-photo-id="${photo.id}" data-action="view-photo">
      <img src="${resolveSrc(photo.src)}" alt="${escapeHtml(photo.name)}">
      <button class="photo-delete-btn" data-action="delete-photo" data-photo-id="${photo.id}" title="删除">✕</button>
      <button class="photo-download-btn" data-action="download-gallery-photo" data-photo-id="${photo.id}" title="下载">⬇</button>
      <div class="photo-item-info">${escapeHtml(photo.name)}</div>
    </div>
  `).join('');
  
  // 视频 HTML
  const videosHtml = videos.map((video, idx) => `
    <div class="photo-item" style="animation-delay: ${(photos.length + idx) * 0.03}s" data-video-id="${video.id}" data-action="view-video">

async function saveItem() {
  const category = document.getElementById('itemCategory').value;
  const name = document.getElementById('itemName').value.trim();
  const account = document.getElementById('itemAccount').value.trim();
  const password = document.getElementById('itemPassword').value;
  const note = document.getElementById('itemNote').value.trim();
  const images = [...state.currentImages];
  
  if (!name) { showToast('请输入名称', true); return; }
  if (!account) { showToast('请输入账号', true); return; }
  
  // 把 dataURL 图片存到 IndexedDB，换成 fileId
  const processedImages = [];
  for (const img of images) {
    if (img && img.startsWith('data:')) {
      const fileId = genFileId('info');
      await cacheFile(fileId, img);
      processedImages.push(fileId);
    } else {
      processedImages.push(img); // 已经是 fileId 或空
    }
  }
  
  const data = getData();
  
  if (state.editingId) {
    const idx = data.findIndex(d => d.id === state.editingId);
    if (idx > -1) {
      // 找出被删除的旧图片，从 IndexedDB 移除
      const oldImages = data[idx].images || [];
      oldImages.forEach(oldImg => {
        if (oldImg && !oldImg.startsWith('data:') && !processedImages.includes(oldImg)) {
          uncacheFile(oldImg);
        }
      });
      data[idx] = { ...data[idx], category, name, account, password, note, images: processedImages };
    }
    showToast('已更新');
  } else {
    const newId = data.length > 0 ? Math.max(...data.map(d => d.id)) + 1 : 1;
    data.push({ id: newId, category, name, account, password, note, images: processedImages, deletedAt: null });
    showToast('已添加');
  }
  
  if (!saveData(data)) return;
  closeItemModal();
  renderCards();
}

function deleteItem() {

  const trashId = Date.now() + Math.random();

  // 从原数据移除
  const newData = data.filter(d => d.id !== state.editingId);
  
  saveData(newData);
  saveTrash(trash);
  
  closeItemModal();
  renderCards();
  updateTrashBadge();
  showToast('已移到回收站');
}

function uploadGalleryPhotos(files) {
  if (!files || !files.length) return;
  
  const remaining = 20 - state.pendingPhotos.length;
  if (remaining <= 0) { showToast('最多20张一批', true); return; }
  
  const filesToAdd = Array.from(files).slice(0, remaining);
  let loaded = 0;
  let failed = 0;
  const total = filesToAdd.length;
  
  filesToAdd.forEach(file => {
    if (!file.type.startsWith('image/')) { failed++; checkDone(); return; }
    if (file.size > 2 * 1024 * 1024) { failed++; checkDone(); return; }
    
    const reader = new FileReader();
    reader.onload = function(e) {
      state.pendingPhotos.push({
        src: e.target.result,
        name: file.name.replace(/\.[^/.]+$/, '') || '未命名'
      });
      loaded++;
      checkDone();
    };
    reader.onerror = function() { failed++; checkDone(); };
    reader.readAsDataURL(file);
  });
  
  function checkDone() {
    if (loaded + failed === total) {
      renderPendingPhotos();
      if (loaded > 0) showToast(`已添加 ${loaded} 张`);
      if (failed > 0) showToast(`${failed} 张失败(>2MB)`, true);
    }
  }
}

// ========== 视频管理 ==========
async function uploadVideos(files) {
  if (!files || !files.length) return;
  if (state.currentAlbumId === null) return;
  
  const gallery = getGallery();
  let newId = gallery.videos.length > 0 
    ? Math.max(...gallery.videos.map(v => v.id)) + 1 : 1;
  
  let loaded = 0;
  const total = files.length;
  
  for (const file of Array.from(files)) {
    if (!file.type.startsWith('video/')) { loaded++; checkDone(); continue; }
    
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      
      // 获取视频时长
      let duration = 0;
      try {
        duration = await new Promise((resolve) => {
          const tempVideo = document.createElement('video');
          tempVideo.preload = 'metadata';
          tempVideo.onloadedmetadata = () => resolve(tempVideo.duration);
          tempVideo.onerror = () => resolve(0);
          tempVideo.src = dataUrl;
        });
      } catch(e) { duration = 0; }
      
      // 保存到 IndexedDB
      const fileId = genFileId('video');
      await cacheFile(fileId, dataUrl);
      
      gallery.videos.push({
        id: newId++,
        albumId: state.currentAlbumId,
        src: fileId,  // 存 fileId
        name: file.name.replace(/\.[^/.]+$/, ''),
        duration: duration,
        createdAt: Date.now()
      });
      
      loaded++;
      checkDone();
    } catch(e) {
      loaded++;
      checkDone();
    }
  }
  
  function checkDone() {
    if (loaded >= total) {
      saveGallery(gallery);
      renderPhotoList(state.currentAlbumId);
      updateGalleryStats();
      showToast(`添加 ${loaded} 个视频`);
    }
  }
}

// ========== 回收站操作 ==========
function restoreInfo(trashId) {
  const trash = getTrash();
  const idx = trash.info.findIndex(i => i.trashId === trashId);
  if (idx === -1) return;
  
  const item = trash.info[idx];
  const data = getData();
  
  // 检查 ID 是否冲突
  let newId = item.id;
  if (data.find(d => d.id === newId)) {
    newId = data.length > 0 ? Math.max(...data.map(d => d.id)) + 1 : 1;
  }
  
  const restoredItem = { ...item, id: newId, deletedAt: null };
  delete restoredItem.trashId;
  delete restoredItem.deletedAt;
  
  data.push(restoredItem);
  trash.info.splice(idx, 1);
  
  saveData(data);
  saveTrash(trash);
  renderTrash();
  updateTrashBadge();
  showToast('已恢复');
}

function deleteInfoForever(trashId) {
  if (!confirm('确定永久删除吗？此操作不可恢复！')) return;
  
  const trash = getTrash();
  const item = trash.info.find(i => i.trashId === trashId);
  if (item) {
    // 删除关联的图片文件
    (item.images || []).forEach(img => {
      if (img && !img.startsWith('data:')) {
        uncacheFile(img);
      }
    });
  }
  trash.info = trash.info.filter(i => i.trashId !== trashId);
  saveTrash(trash);
  renderTrash();
  updateTrashBadge();
  showToast('已永久删除');
}

  if (!confirm(`确定清空回收站吗？\n\n共 ${total} 个项目将被永久删除，不可恢复！`)) return;
  
  // 删除所有关联的文件
  trash.info.forEach(item => {
    (item.images || []).forEach(img => {
      if (img && !img.startsWith('data:')) uncacheFile(img);

  trash.photos.forEach(photo => {

  trash.videos.forEach(video => {

  }));
  state.viewerIndex = imgIdx;
  state.viewerRotation = 0;
  showViewer();
}

function openPhotoViewer(photoId) {
  if (!window._photoList) return;
  const list = window._photoList;
  const idx = list.findIndex(p => p.id === photoId);
  if (idx === -1) return;
  
  state.viewerImages = list.map(p => ({
    src: p.src,
    name: p.name,
    caption: p.name
  }));
  state.viewerIndex = idx;
  state.viewerRotation = 0;
  showViewer();
}

function showViewer() {
  const viewer = document.getElementById('imageViewer');
  const img = document.getElementById('viewerImage');
  const caption = document.getElementById('viewerCaption');
  
  img.style.transform = `rotate(${state.viewerRotation}deg) scale(1)`;

function closeViewer() {

  state.viewerRotation = 0;
}

// ========== 视频查看器 ==========

function navImage(dir) {

function downloadImage() {

// ========== 导入/导出 ==========
function exportData() {
  const data = getData();
  const gallery = getGallery();
  const trash = getTrash();
  
  if (!data.length && !gallery.photos.length && !gallery.videos.length && !trash.info.length && !trash.photos.length && !trash.videos.length) {
    showToast('没有数据可导出', true);
    return;
  }
  
  // 把 fileId 替换成实际 dataURL，确保导出文件完整
  const resolveItemImages = (item) => ({
    ...item,
    images: (item.images || []).map(img => resolveSrc(img) || img)
  });
  
  const exportData = data.map(resolveItemImages);
  
  const exportGallery = {
    ...gallery,
    photos: gallery.photos.map(p => ({ ...p, src: resolveSrc(p.src) || p.src })),
    videos: gallery.videos.map(v => ({ ...v, src: resolveSrc(v.src) || v.src }))
  };
  
  const exportTrash = {
    info: trash.info.map(resolveItemImages),
    photos: trash.photos.map(p => ({ ...p, src: resolveSrc(p.src) || p.src })),
    videos: trash.videos.map(v => ({ ...v, src: resolveSrc(v.src) || v.src }))
  };
  
  const exportObj = {
    version: 4,
    exportTime: new Date().toISOString(),
    data: exportData,
    gallery: exportGallery,
    trash: exportTrash
  };
  
  const jsonStr = JSON.stringify(exportObj);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  const d = new Date();
  a.download = `my-vault-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  showToast('已导出备份');
}

async function handleImport(file) {
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      const dataToImport = imported.data || [];
      const galleryToImport = imported.gallery || { albums: [], photos: [], videos: [] };
      const trashToImport = imported.trash || { info: [], photos: [], videos: [] };
      
      const videoCount = galleryToImport.videos?.length || 0;
      const trashVideoCount = trashToImport.videos?.length || 0;
      if (!confirm(`确定导入备份数据吗？\n\n信息: ${dataToImport.length} 条\n相册: ${galleryToImport.albums?.length || 0} 个\n照片: ${galleryToImport.photos?.length || 0} 张\n视频: ${videoCount} 个\n回收站: ${(trashToImport.info?.length || 0) + (trashToImport.photos?.length || 0) + trashVideoCount} 项\n\n将合并到现有数据中。`)) return;
      
      const existingData = getData();
      const existingGallery = getGallery();
      const existingTrash = getTrash();
      
      showToast('正在导入，请稍候...');
      
      // 合并信息数据（重新分配ID避免冲突，并把图片存到 IndexedDB）
      let nextId = existingData.length > 0 ? Math.max(...existingData.map(d => d.id)) + 1 : 1;
      for (const item of dataToImport) {
        const newImages = [];
        for (const img of (item.images || [])) {
          if (img && img.startsWith('data:')) {
            const fileId = genFileId('info');
            await cacheFile(fileId, img);
            newImages.push(fileId);
          } else {
            newImages.push(img);
          }
        }
        existingData.push({ ...item, id: nextId++, images: newImages });
      }
      
      // 合并相册（重新分配ID）
      let nextAlbumId = existingGallery.albums.length > 0 
        ? Math.max(...existingGallery.albums.map(a => a.id)) + 1 : 1;
      const albumIdMap = {};
      (galleryToImport.albums || []).forEach(album => {
        const oldId = album.id;
        const newAlbum = { ...album, id: nextAlbumId };
        existingGallery.albums.push(newAlbum);
        albumIdMap[oldId] = nextAlbumId;
        nextAlbumId++;
      });
      
      // 合并照片（重新分配ID，映射相册ID，存到 IndexedDB）
      let nextPhotoId = existingGallery.photos.length > 0
        ? Math.max(...existingGallery.photos.map(p => p.id)) + 1 : 1;
      for (const photo of (galleryToImport.photos || [])) {
        const newAlbumId = albumIdMap[photo.albumId] || (existingGallery.albums[0]?.id);
        if (newAlbumId) {
          let newSrc = photo.src;
          if (photo.src && photo.src.startsWith('data:')) {
            newSrc = genFileId('photo');
            await cacheFile(newSrc, photo.src);
          }
          existingGallery.photos.push({ ...photo, id: nextPhotoId++, albumId: newAlbumId, src: newSrc });
        }
      }
      
      // 合并视频（重新分配ID，映射相册ID，存到 IndexedDB）
      let nextVideoId = existingGallery.videos.length > 0
        ? Math.max(...existingGallery.videos.map(v => v.id)) + 1 : 1;
      for (const video of (galleryToImport.videos || [])) {
        const newAlbumId = albumIdMap[video.albumId] || (existingGallery.albums[0]?.id);
        if (newAlbumId) {
          let newSrc = video.src;
          if (video.src && video.src.startsWith('data:')) {
            newSrc = genFileId('video');
            await cacheFile(newSrc, video.src);
          }
          existingGallery.videos.push({ ...video, id: nextVideoId++, albumId: newAlbumId, src: newSrc });
        }
      }
      
      // 合并回收站（存文件到 IndexedDB）
      for (const item of (trashToImport.info || [])) {
        const newImages = [];
        for (const img of (item.images || [])) {
          if (img && img.startsWith('data:')) {
            const fileId = genFileId('info');
            await cacheFile(fileId, img);
            newImages.push(fileId);
          } else {
            newImages.push(img);
          }
        }
        existingTrash.info.push({ ...item, images: newImages, trashId: Date.now() + Math.random() });
      }
      
      for (const photo of (trashToImport.photos || [])) {
        let newSrc = photo.src;
        if (photo.src && photo.src.startsWith('data:')) {
          newSrc = genFileId('photo');
          await cacheFile(newSrc, photo.src);
        }
        existingTrash.photos.push({ ...photo, src: newSrc, trashId: Date.now() + Math.random() });
      }
      
      for (const video of (trashToImport.videos || [])) {
        let newSrc = video.src;
        if (video.src && video.src.startsWith('data:')) {
          newSrc = genFileId('video');
          await cacheFile(newSrc, video.src);
        }
        existingTrash.videos.push({ ...video, src: newSrc, trashId: Date.now() + Math.random() });
      }
      
      saveData(existingData);
      saveGallery(existingGallery);
      saveTrash(existingTrash);
      
      if (state.isLoggedIn) {
        renderAll();
        updateTrashBadge();
      }
      
      showToast('导入成功');
    } catch(err) {
      showToast('导入失败：文件格式错误', true);
    }
  };
  reader.readAsText(file);
}

// ========== 事件委托（核心：统一处理所有 data-action 点击） ==========
document.addEventListener('click', function(e) {
  // 向上找最近的带 data-action 的元素
  const target = e.target.closest('[data-action]');
  if (!target) return;
  
  const action = target.dataset.action;
  
  // 阻止冒泡，避免父级 data-action 也触发
  e.stopPropagation();
  
  switch(action) {
    // ===== 登录页 =====
    case 'toggle-pass': {
      const targetId = target.dataset.target;
      const input = document.getElementById(targetId);
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
        target.textContent = input.type === 'password' ? '👁' : '🙈';
      }
      break;
    }
    case 'login':
      doLogin();
      break;
    case 'setup':
      doSetup();
      break;
    case 'reset-all':
      resetAll();
      break;
    case 'import': {
      const fileInput = document.getElementById('importFile');
      if (fileInput) fileInput.click();
      break;
    }
    case 'export':
      exportData();
      break;
    
    // ===== 顶栏 =====
    case 'trash':
      showTrash();
      break;
    case 'lock':
      lockApp();
      break;
    
    // ===== 相册 =====
    case 'new-album':
      openAlbumModal();
      break;
    case 'back-albums':
      backToAlbums();
      break;
    case 'add-photos':
      openAddPhotosModal();
      break;
    
    // ===== 回收站 =====
    case 'empty-trash':
      emptyTrash();
      break;
    case 'restore-info': {
      const trashId = parseFloat(target.dataset.trashId);
      restoreInfo(trashId);
      break;
    }
    case 'delete-info-forever': {
      const trashId = parseFloat(target.dataset.trashId);
      deleteInfoForever(trashId);
      break;
    }
    case 'restore-photo': {
      const trashId = parseFloat(target.dataset.trashId);
      restorePhoto(trashId);
      break;
    }
    case 'delete-photo-forever': {
      const trashId = parseFloat(target.dataset.trashId);
      deletePhotoForever(trashId);
      break;
    }
    
    // ===== 信息弹窗 =====
    case 'close-item-modal':
      closeItemModal();
      break;
    case 'delete-item':
      deleteItem();
      break;
    case 'save-item':
      saveItem();
      break;
    case 'remove-img-at': {
      const idx = parseInt(target.dataset.idx);
      if (!isNaN(idx)) {
        state.currentImages.splice(idx, 1);
        renderImagesList();
      }
      break;
    }
    case 'pick-images':
      document.getElementById('imageInput').click();
      break;
    
    // ===== 相册弹窗 =====
    case 'close-album-modal':
      closeAlbumModal();
      break;
    case 'delete-album':
      deleteAlbum();
      break;
    case 'save-album':
      saveAlbum();
      break;
    
    // ===== 添加照片弹窗 =====
    case 'close-photos-modal':
      closeAddPhotosModal();
      break;
    case 'confirm-photos':
      confirmAddPhotos();
      break;
    case 'remove-pending-photo': {
      const idx = parseInt(target.dataset.idx);
      if (!isNaN(idx)) {
        state.pendingPhotos.splice(idx, 1);
        renderPendingPhotos();
      }
      break;
    }
    case 'pick-gallery-photos':
      document.getElementById('galleryPhotoInput').click();
      break;
    
    // ===== 图片查看器 =====
    case 'close-viewer':
      closeViewer();
      break;
    case 'rotate-img':
      rotateImage();
      break;
    case 'download-img':
      downloadImage();
      break;
    case 'prev-img':
      navImage(-1);
      break;
    case 'next-img':
      navImage(1);
      break;
    
    // ===== 卡片操作 =====
    case 'edit-item': {
      const itemId = parseInt(target.dataset.itemId);
      if (!isNaN(itemId)) openEditModal(itemId);
      break;
    }
    case 'copy': {
      const text = decodeURIComponent(target.dataset.text || '');
      copyText(text);
      break;
    }
    case 'toggle-pwd': {
      const itemId = target.dataset.itemId;
      const pwdEl = document.getElementById('pwd-' + itemId);
      if (pwdEl) {
        const data = getData();
        const item = data.find(d => d.id == itemId);
        if (item) {
          if (state.revealedPwds[itemId]) {
            pwdEl.textContent = '••••••••';
            pwdEl.classList.add('masked');
            state.revealedPwds[itemId] = false;
          } else {
            pwdEl.textContent = escapeHtml(item.password);
            pwdEl.classList.remove('masked');
            state.revealedPwds[itemId] = true;
          }
        }
      }
      break;
    }
    case 'view-img': {
      const itemId = parseInt(target.dataset.itemId);
      const imgIdx = parseInt(target.dataset.imgIdx);
      if (!isNaN(itemId) && !isNaN(imgIdx)) {
        openViewerFromItem(itemId, imgIdx);
      }
      break;
    }
    case 'remove-card-img': {
      const itemId = parseInt(target.dataset.itemId);
      const imgIdx = parseInt(target.dataset.imgIdx);
      if (!isNaN(itemId) && !isNaN(imgIdx)) {
        if (!confirm('确定删除这张图片吗？')) return;
        const data = getData();
        const item = data.find(d => d.id === itemId);
        if (item && item.images) {
          const removed = item.images.splice(imgIdx, 1);
          // 从 IndexedDB 删除
          if (removed.length && removed[0] && !removed[0].startsWith('data:')) {
            uncacheFile(removed[0]);
          }
          saveData(data);
          renderCards();
          showToast('图片已删除');
        }
      }
      break;
    }
    case 'download-card-img': {
      const itemId = parseInt(target.dataset.itemId);
      const imgIdx = parseInt(target.dataset.imgIdx);
      if (!isNaN(itemId) && !isNaN(imgIdx)) {
        const data = getData();
        const item = data.find(d => d.id === itemId);
        if (item && item.images && item.images[imgIdx]) {
          const a = document.createElement('a');
          a.href = resolveSrc(item.images[imgIdx]);
          a.download = (item.name || 'image') + '-' + (imgIdx + 1) + '.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast('已下载');
        }
      }
      break;
    }
    
    // ===== 照片操作 =====
    case 'view-photo': {
      const photoId = parseInt(target.dataset.photoId);
      if (!isNaN(photoId)) openPhotoViewer(photoId);
      break;
    }
    case 'delete-photo': {
      const photoId = parseInt(target.dataset.photoId);
      if (!isNaN(photoId)) deletePhoto(photoId);
      break;
    }
    case 'download-gallery-photo': {
      const photoId = parseInt(target.dataset.photoId);
      if (!isNaN(photoId)) {
        const gallery = getGallery();
        const photo = gallery.photos.find(p => p.id === photoId);
        if (photo && photo.src) {
          const a = document.createElement('a');
          a.href = resolveSrc(photo.src);
          a.download = (photo.name || 'photo') + '.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast('已下载');
        }
      }
      break;
    }
    case 'download-trash-photo': {
      const trashId = parseFloat(target.dataset.trashId);
      const trash = getTrash();
      const photo = trash.photos.find(p => p.trashId === trashId);
      if (photo && photo.src) {
        const a = document.createElement('a');
        a.href = resolveSrc(photo.src);
        a.download = (photo.name || 'photo') + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('已下载');
      }
      break;
    }
    
    // ===== 视频操作 =====
    case 'view-video': {
      const videoId = parseInt(target.dataset.videoId);
      if (!isNaN(videoId)) openVideoViewer(videoId);
      break;
    }
    case 'delete-video': {
      const videoId = parseInt(target.dataset.videoId);
      if (!isNaN(videoId)) deleteVideo(videoId);
      break;
    }
    case 'download-gallery-video': {
      const videoId = parseInt(target.dataset.videoId);
      if (!isNaN(videoId)) {
        const gallery = getGallery();
        const video = gallery.videos.find(v => v.id === videoId);
        if (video && video.src) {
          const a = document.createElement('a');
          a.href = resolveSrc(video.src);
          a.download = (video.name || 'video') + '.mp4';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast('已下载');
        }
      }
      break;
    }
    case 'download-trash-video': {
      const trashId = parseFloat(target.dataset.trashId);
      const trash = getTrash();
      const video = trash.videos.find(v => v.trashId === trashId);
      if (video && video.src) {
        const a = document.createElement('a');
        a.href = resolveSrc(video.src);
        a.download = (video.name || 'video') + '.mp4';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('已下载');
      }
      break;
    }
    case 'restore-video': {
      const trashId = parseFloat(target.dataset.trashId);
      if (!isNaN(trashId)) restoreVideo(trashId);
      break;
    }
    case 'delete-video-forever': {
      const trashId = parseFloat(target.dataset.trashId);
      if (!isNaN(trashId)) deleteVideoForever(trashId);
      break;
    }
    case 'add-videos': {
      document.getElementById('galleryVideoInput').click();
      break;
    }
    case 'close-video-viewer': {
      closeVideoViewer();
      break;
    }
    case 'download-video': {
      downloadCurrentVideo();
      break;
    }
    
    // ===== 浮动按钮 =====
    case 'fab-add':
      if (state.currentTab === 'info') {
        openAddModal();
      } else if (state.currentTab === 'gallery') {
        if (state.currentAlbumId !== null) {
          openAddPhotosModal();
        } else {
          openAlbumModal();
        }
      }
      break;
  }
});

    renderCategoryTabs();
    renderCards();
    return;

    e.stopPropagation();
    state.trashTab = trashSubtab.dataset.trashTab;

document.getElementById('imageInput').addEventListener('change', function(e) {
  const files = e.target.files;
  if (!files || !files.length) return;
  
  const maxImgs = 9 - state.currentImages.length;
  const filesToProcess = Array.from(files).slice(0, maxImgs);
  
  filesToProcess.forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      state.currentImages.push(ev.target.result);
      renderImagesList();
    };
    reader.readAsDataURL(file);
  });
  
  e.target.value = '';
});

document.getElementById('galleryPhotoInput').addEventListener('change', function(e) {
  const files = e.target.files;
  if (!files || !files.length) return;
  
  const maxImgs = 20 - state.pendingPhotos.length;
  const filesToProcess = Array.from(files).slice(0, maxImgs);
  
  filesToProcess.forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      state.pendingPhotos.push({
        src: ev.target.result,
        name: file.name.replace(/\.[^/.]+$/, '')
      });
      renderPendingPhotos();
    };
    reader.readAsDataURL(file);
  });
  
  e.target.value = '';
});

// 视频文件上传
document.getElementById('galleryVideoInput').addEventListener('change', function(e) {
  const files = e.target.files;
  uploadVideos(files);
  e.target.value = '';
});

// ===== 键盘快捷键 =====
document.addEventListener('keydown', function(e) {
  // 登录页回车登录
  if (e.key === 'Enter') {
    if (document.getElementById('loginPage').style.display !== 'none') {
      if (document.getElementById('loginForm').style.display !== 'none') {
        doLogin();
      } else if (document.getElementById('setupForm').style.display !== 'none') {
        doSetup();
      }
    }
  }
  
  // ESC 关闭弹窗 / 查看器
  if (e.key === 'Escape') {
    const viewer = document.getElementById('imageViewer');
    if (viewer.classList.contains('show')) {
      closeViewer();
      return;
    }
    const videoViewer = document.getElementById('videoViewer');
    if (videoViewer.classList.contains('show')) {
      closeVideoViewer();
      return;
    }
    if (document.getElementById('itemModal').classList.contains('show')) {
      closeItemModal();
      return;
    }
    if (document.getElementById('albumModal').classList.contains('show')) {
      closeAlbumModal();
      return;
    }
    if (document.getElementById('addPhotosModal').classList.contains('show')) {
      closeAddPhotosModal();
      return;
    }
    if (state.currentView === 'trash') {
      backToMain();
      return;
    }
  }
  
  // 查看器快捷键
  const viewer = document.getElementById('imageViewer');
  if (viewer.classList.contains('show')) {
    if (e.key === 'ArrowLeft') navImage(-1);
    else if (e.key === 'ArrowRight') navImage(1);
    else if (e.key === 'r' || e.key === 'R') rotateImage();
  }
});

// ===== 阻止弹窗内部点击关闭弹窗 =====
document.querySelectorAll('.modal-content').forEach(el => {
  el.addEventListener('click', function(e) {
    e.stopPropagation();
  });
});

// ===== 点击弹窗背景关闭 =====
document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', function(e) {
    if (e.target === modal) {
      modal.classList.remove('show');
    }
  });
});

// ========== 初始化 ==========
async function init() {
  try {
    await initDB();
    await loadFileCache();
  } catch(e) {
    console.error('数据库初始化失败', e);
  }
  
  if (hasPassword()) {
    showLoginForm();
  } else {
    showSetupForm();
  }
}

init();
</script>
